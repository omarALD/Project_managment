<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Task & Time Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

  <!-- Header Section -->
  <header class="max-w-6xl mx-auto mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800 pb-5">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold text-indigo-400 tracking-tight">🚀 Project Task & Time Tracker</h1>
      <p class="text-xs md:text-sm text-slate-400 mt-1">Shared workspace for project management and progress monitoring</p>
    </div>
    <div class="flex items-center gap-3">
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Live Sync
      </span>
      <button onclick="fetchTasks()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg text-xs font-medium transition border border-slate-700">
        🔄 Refresh
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto space-y-8">
    
    <!-- Add Task Form -->
    <section class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl">
      <h2 class="text-sm font-semibold text-slate-300 mb-4 flex items-center gap-2">
        <span>✨ Create New Task</span>
      </h2>
      <form id="task-form" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
        
        <!-- Task Title -->
        <input 
          type="text" 
          id="task-title" 
          placeholder="Task title or description..." 
          required 
          class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
        >
        
        <!-- Assignee Selection -->
        <select id="task-assignee" class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
          <option value="Omar Al-Humaidi">Omar Al-Humaidi</option>
          <option value="Mohammad Saeid">Mohammad Saeid</option>
          <option value="Salman Al-Saai">Salman Al-Saai</option>
          <option value="Al-Jaber">Al-Jaber</option>
        </select>

        <!-- Due Date -->
        <input 
          type="date" 
          id="task-deadline" 
          class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition"
        >

        <!-- Submit Button -->
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 font-semibold text-white rounded-xl px-4 py-2.5 text-sm transition shadow-lg shadow-indigo-600/20 active:scale-[0.98]">
          + Add Task
        </button>
      </form>
    </section>

    <!-- Kanban Board Columns -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- To Do Column -->
      <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800/80 flex flex-col">
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
          <h3 class="font-semibold text-amber-400 text-sm flex items-center gap-2">
            <span>⏳ To Do</span>
          </h3>
          <span id="count-todo" class="bg-amber-400/10 text-amber-400 text-xs font-semibold px-2.5 py-0.5 rounded-full border border-amber-400/20">0</span>
        </div>
        <div id="col-todo" class="space-y-3 flex-1 min-h-[200px]"></div>
      </div>

      <!-- In Progress Column -->
      <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800/80 flex flex-col">
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
          <h3 class="font-semibold text-blue-400 text-sm flex items-center gap-2">
            <span>🚀 In Progress</span>
          </h3>
          <span id="count-in-progress" class="bg-blue-400/10 text-blue-400 text-xs font-semibold px-2.5 py-0.5 rounded-full border border-blue-400/20">0</span>
        </div>
        <div id="col-in-progress" class="space-y-3 flex-1 min-h-[200px]"></div>
      </div>

      <!-- Completed Column -->
      <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800/80 flex flex-col">
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
          <h3 class="font-semibold text-emerald-400 text-sm flex items-center gap-2">
            <span>✅ Completed</span>
          </h3>
          <span id="count-done" class="bg-emerald-400/10 text-emerald-400 text-xs font-semibold px-2.5 py-0.5 rounded-full border border-emerald-400/20">0</span>
        </div>
        <div id="col-done" class="space-y-3 flex-1 min-h-[200px]"></div>
      </div>

    </section>
  </main>

  <script>
    async function fetchTasks() {
      try {
        const res = await fetch('/api/tasks');
        const tasks = await res.json();
        renderTasks(tasks);
      } catch (err) {
        console.error("Error fetching tasks:", err);
      }
    }

    function renderTasks(tasks) {
      const cols = {
        todo: document.getElementById('col-todo'),
        'in-progress': document.getElementById('col-in-progress'),
        done: document.getElementById('col-done')
      };

      Object.values(cols).forEach(col => col.innerHTML = '');

      let counts = { todo: 0, 'in-progress': 0, done: 0 };

      tasks.forEach(task => {
        counts[task.status]++;
        const card = document.createElement('div');
        card.className = "bg-slate-950 p-4 rounded-xl border border-slate-800 shadow-sm space-y-3 hover:border-slate-700 transition";
        card.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <h4 class="font-medium text-sm text-slate-100 leading-snug">${task.title}</h4>
            <button onclick="deleteTask('${task.id}')" class="text-slate-500 hover:text-red-400 transition text-xs">✕</button>
          </div>
          <div class="flex justify-between items-center text-xs text-slate-400 pt-1">
            <span class="flex items-center gap-1 font-medium text-slate-300">👤 ${task.assignee}</span>
            <span class="text-slate-500">📅 ${task.deadline || 'No date'}</span>
          </div>
          <div class="pt-2 border-t border-slate-800/80 flex gap-1.5 text-[11px]">
            ${task.status !== 'todo' ? `<button onclick="updateStatus('${task.id}', 'todo')" class="bg-slate-900 hover:bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-800 transition">To Do</button>` : ''}
            ${task.status !== 'in-progress' ? `<button onclick="updateStatus('${task.id}', 'in-progress')" class="bg-slate-900 hover:bg-slate-800 text-blue-400 px-2.5 py-1 rounded-lg border border-slate-800 transition">Progress</button>` : ''}
            ${task.status !== 'done' ? `<button onclick="updateStatus('${task.id}', 'done')" class="bg-emerald-950/60 hover:bg-emerald-900/60 text-emerald-400 px-2.5 py-1 rounded-lg border border-emerald-800/50 transition">Done</button>` : ''}
          </div>
        `;
        if (cols[task.status]) cols[task.status].appendChild(card);
      });

      document.getElementById('count-todo').textContent = counts.todo;
      document.getElementById('count-in-progress').textContent = counts['in-progress'];
      document.getElementById('count-done').textContent = counts.done;
    }

    document.getElementById('task-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('task-title').value;
      const assignee = document.getElementById('task-assignee').value;
      const deadline = document.getElementById('task-deadline').value;

      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, assignee, deadline })
      });

      document.getElementById('task-title').value = '';
      fetchTasks();
    });

    async function updateStatus(id, status) {
      await fetch(`/api/tasks/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      fetchTasks();
    }

    async function deleteTask(id) {
      await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
      fetchTasks();
    }

    // Auto-sync every 4 seconds
    fetchTasks();
    setInterval(fetchTasks, 4000);
  </script>
</body>
</html>
