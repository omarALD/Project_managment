name: Temporary Render Keep-Alive

on:
  schedule:
    # تقليل الفترة إلى كل 5 دقائق لضمان عدم تجاوز نافذة الـ 15 دقيقة عند تأخر GitHub
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check Expiration and Send Ping
        run: |
          EXPIRATION_DATE="2026-11-02"
          CURRENT_DATE=$(date +%Y-%m-%d)

          if [[ "$CURRENT_DATE" > "$EXPIRATION_DATE" ]]; then
            echo "The temporary period has expired. Stopping keep-alive execution."
            exit 0
          fi

          echo "Sending keep-alive ping to Render..."
          # إرسال الطلب مع إضافة Max-time وتتبع الاستجابة
          curl -sS --max-time 60 https://project-managment-zucj.onrender.com/ > /dev/null || echo "Ping failed or timed out"
