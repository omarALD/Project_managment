<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Task Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" type="image/png" href="logo.png">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 selection:bg-indigo-500 selection:text-white">

  <!-- Background Decorative Light Blurs -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/15 rounded-full blur-[120px]"></div>
    <div class="absolute top-1/2 -right-40 w-96 h-96 bg-purple-600/15 rounded-full blur-[120px]"></div>
    <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-emerald-600/10 rounded-full blur-[120px]"></div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

  <!-- Header -->
  <header class="max-w-7xl mx-auto mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800/80 pb-6">
    <div>
      <h1 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400">
        🚀 Team Task Manager
      </h1>
<!-- داخل <header>: أضف break-words للسطر الذي يحتوي Workspace -->
      <p class="text-xs md:text-sm text-slate-400 mt-1 break-words">
          Workspace: <span id="current-project-label" class="font-bold text-indigo-400">...</span>
      </p>
    </div>
<!-- الحاوية اليمنى في الهيدر (التي تحتوي connection-status و btn-refresh) -->
    <div class="flex flex-wrap items-center gap-2 sm:gap-3 w-full sm:w-auto">      <span id="connection-status" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-500/10 text-slate-400 border border-slate-500/20">
        <span class="w-2 h-2 rounded-full bg-slate-400"></span>
        Connecting...
      </span>
      <button id="btn-refresh" class="bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition border border-slate-800 flex items-center gap-1.5">
        <span>🔄</span> Refresh
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto space-y-10">

    <!-- Add Task Form -->
    <section class="glass-panel p-6 rounded-3xl shadow-2xl relative overflow-hidden">
      <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2 mb-4">
        <span class="p-1.5 bg-indigo-500/10 text-indigo-400 rounded-lg">✨</span>
        Create New Task
      </h2>

      <form id="task-form" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-3">

        <div class="sm:col-span-2 lg:col-span-5">
          <label class="block text-[11px] font-medium text-slate-400 mb-1">Task Name</label>
          <input
            type="text"
            id="task-title"
            placeholder="e.g. Deploy API, Review PR..."
            required
            maxlength="200"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
          >
        </div>

        <div class="lg:col-span-2">
          <label class="block text-[11px] font-medium text-slate-400 mb-1">Assignee</label>
          <select id="task-assignee" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
            <option value="Omar Al-Humaidi">👤 Omar</option>
            <option value="Mohammad Saeid">👤 Mohammad</option>
            <option value="Salman Al-Saai">👤 Salman</option>
            <option value="Al-Jaber">👤 Al-Jaber</option>
          </select>
        </div>

        <div class="lg:col-span-2">
          <label class="block text-[11px] font-medium text-slate-400 mb-1">Priority</label>
          <select id="task-priority" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
            <option value="low">🟢 Low</option>
            <option value="medium" selected>🟡 Medium</option>
            <option value="high">🟠 High</option>
            <option value="critical">🔴 Critical</option>
          </select>
        </div>

        <div class="sm:col-span-2 lg:col-span-3">
  <div class="flex flex-wrap justify-between items-center gap-2 mb-1">
    <label class="block text-[11px] font-medium text-slate-400">Deadline</label>
    <div class="flex flex-wrap gap-1.5 md:gap-1">

              <button type="button" data-quicktime="2" class="quicktime-btn text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded transition">+2h</button>
              <button type="button" data-quicktime="24" class="quicktime-btn text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded transition">+1d</button>
              <button type="button" data-quicktime="72" class="quicktime-btn text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded transition">+3d</button>
              <button type="button" data-quicktime="168" class="quicktime-btn text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded transition">+1w</button>
            </div>
          </div>
          <input
            type="datetime-local"
            id="task-deadline"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500 transition"
          >
        </div>

        <div class="sm:col-span-2 lg:col-span-12 flex justify-end">
  <button type="submit" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl py-2.5 px-6 text-sm transition shadow-lg shadow-indigo-600/25 active:scale-[0.98] flex items-center justify-center gap-1.5">
            <span>+</span> Create Task
          </button>
        </div>
      </form>
    </section>

    <!-- Kanban Board -->
    <!-- Mobile Status Tabs (يظهر على الجوال فقط) -->
<div class="block md:hidden -mb-6">
  <div class="grid grid-cols-3 gap-2 glass-panel p-1.5 rounded-2xl">
    <button type="button" data-tab="todo" class="status-tab active">
      <span class="text-[11px] font-semibold leading-tight">⏳ To Do</span>
      <span id="tab-count-todo" class="tab-count">0</span>
    </button>
    <button type="button" data-tab="in-progress" class="status-tab">
      <span class="text-[11px] font-semibold leading-tight">🚀 In Progress</span>
      <span id="tab-count-in-progress" class="tab-count">0</span>
    </button>
    <button type="button" data-tab="done" class="status-tab">
      <span class="text-[11px] font-semibold leading-tight">✅ Done</span>
      <span id="tab-count-done" class="tab-count">0</span>
    </button>
  </div>
</div> 
    <!-- Assignee Filter -->
<!-- Filters: Search + Priority + Assignee -->
<div class="space-y-3 -mb-4">
  <div class="flex flex-col md:flex-row gap-3 md:items-center">
    <div class="relative md:w-72">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-sm">🔎</span>
      <input id="search-input" type="search" placeholder="Search tasks..."
        class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
    </div>
    <div id="priority-filter" class="flex flex-wrap items-center gap-2"></div>
  </div>
  <div id="assignee-filter" class="flex flex-wrap items-center gap-2"></div>
</div>
    <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="glass-panel p-5 rounded-3xl flex flex-col">
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800/80">
          <h3 class="font-bold text-amber-400 text-sm flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block"></span>
            ⏳ To Do
          </h3>
          <span id="count-todo" class="bg-amber-400/10 text-amber-400 text-xs font-bold px-2.5 py-0.5 rounded-full border border-amber-400/20">0</span>
        </div>
        <div id="col-todo" class="space-y-3 flex-1 min-h-[220px]"></div>
      </div>

      <div class="glass-panel p-5 rounded-3xl flex flex-col">
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800/80">
          <h3 class="font-bold text-blue-400 text-sm flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-400 inline-block"></span>
            🚀 In Progress
          </h3>
          <span id="count-in-progress" class="bg-blue-400/10 text-blue-400 text-xs font-bold px-2.5 py-0.5 rounded-full border border-blue-400/20">0</span>
        </div>
        <div id="col-in-progress" class="space-y-3 flex-1 min-h-[220px]"></div>
      </div>

      <div class="glass-panel p-5 rounded-3xl flex flex-col">
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800/80">
          <h3 class="font-bold text-emerald-400 text-sm flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 inline-block"></span>
            ✅ Completed
          </h3>
          <span id="count-done" class="bg-emerald-400/10 text-emerald-400 text-xs font-bold px-2.5 py-0.5 rounded-full border border-emerald-400/20">0</span>
        </div>
        <div id="col-done" class="space-y-3 flex-1 min-h-[220px]"></div>
      </div>
    </section>

    <!-- CALENDAR SECTION -->
    <section class="glass-panel p-6 rounded-3xl shadow-2xl border border-purple-500/20 relative overflow-hidden">
      <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 pb-4 border-b border-slate-800">
        <h2 class="text-base md:text-lg font-bold text-slate-100 flex items-center gap-2">
          <span class="p-2 bg-purple-500/10 text-purple-400 rounded-xl">📅</span>
          Deadline Calendar
        </h2>

        <div class="flex flex-wrap items-center gap-3">
          <div class="flex bg-slate-900/90 border border-slate-800 p-1 rounded-xl text-xs">
            <button data-cal-view="day" class="cal-view-btn px-3 py-1 rounded-lg text-slate-400 hover:text-white transition">Day</button>
            <button data-cal-view="week" class="cal-view-btn px-3 py-1 rounded-lg bg-purple-600 text-white font-medium transition">Week</button>
            <button data-cal-view="month" class="cal-view-btn px-3 py-1 rounded-lg text-slate-400 hover:text-white transition">Month</button>
          </div>

          <div class="flex items-center gap-1 bg-slate-900/90 border border-slate-800 rounded-xl p-1">
            <button id="cal-prev" class="px-2.5 py-1 rounded-lg text-slate-300 hover:bg-slate-800 transition text-sm">←</button>
            <button id="cal-today" class="px-3 py-1 rounded-lg text-slate-300 hover:bg-slate-800 transition text-xs font-medium">Today</button>
            <button id="cal-next" class="px-2.5 py-1 rounded-lg text-slate-300 hover:bg-slate-800 transition text-sm">→</button>
          </div>
        </div>
      </div>

      <div class="mt-4 mb-4 flex items-center justify-between">
        <h3 id="cal-title" class="text-lg font-bold text-slate-100">—</h3>
        <div id="cal-range" class="text-xs text-slate-400 font-mono"></div>
      </div>

      <div id="calendar-container" class="overflow-x-auto"></div>

      <div class="mt-4 pt-4 border-t border-slate-800/80 flex flex-wrap items-center gap-4 text-[11px] text-slate-400">
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span> To Do</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span> In Progress</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span> Done</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span> Overdue</span>
      </div>
    </section>

  </main>
<!-- Edit Task Modal -->
<div id="edit-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
  <form id="edit-form" class="glass-panel w-full max-w-md p-6 rounded-3xl shadow-2xl space-y-4">
    <h3 class="text-sm font-bold text-slate-200 uppercase tracking-wider">✏️ Edit Task</h3>
    <input type="hidden" id="edit-id">

    <div>
      <label class="block text-[11px] font-medium text-slate-400 mb-1">Task Name</label>
      <input id="edit-title" type="text" required maxlength="200"
        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-[11px] font-medium text-slate-400 mb-1">Assignee</label>
        <select id="edit-assignee" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition"></select>
      </div>
      <div>
        <label class="block text-[11px] font-medium text-slate-400 mb-1">Priority</label>
        <select id="edit-priority" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
          <option value="low">🟢 Low</option>
          <option value="medium">🟡 Medium</option>
          <option value="high">🟠 High</option>
          <option value="critical">🔴 Critical</option>
        </select>
      </div>
    </div>

    <div>
      <label class="block text-[11px] font-medium text-slate-400 mb-1">Deadline</label>
      <input id="edit-deadline" type="datetime-local"
        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500 transition">
    </div>

    <div class="flex justify-end gap-2 pt-2">
      <button type="button" data-close-modal class="bg-slate-900 hover:bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm border border-slate-800 transition">Cancel</button>
      <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-5 py-2 rounded-xl text-sm transition shadow-lg shadow-indigo-600/25">Save</button>
    </div>
  </form>
</div>
  <script src="/app.js"></script>
</body>
</html>
