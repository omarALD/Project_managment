<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Task Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // ===== الهوية اللونية: غيّر الألوان من هنا فقط =====
    const accent = {
      50: '#eef5ff', 100: '#d9e8ff', 200: '#bcd5ff', 300: '#93bbff',
      400: '#6aa0fa', 500: '#4a86ee', 600: '#3b73d9', 700: '#315fb5',
      800: '#2a4d92', 900: '#243f73', 950: '#17264a'
    };
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            indigo: accent,   // كل ما كان indigo/purple/pink
            purple: accent,   // صار لوناً واحداً
            pink: accent,
            slate: {          // رمادي فحمي محايد
              50: '#f6f6f7', 100: '#ececee', 200: '#d4d5d9', 300: '#b4b6bd',
              400: '#8e9099', 500: '#6b6d77', 600: '#4a4c55', 700: '#35373e',
              800: '#27292f', 900: '#1b1c21', 950: '#131417'
            }
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" type="image/png" href="logo.png">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 selection:bg-indigo-500 selection:text-white">

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

  <!-- Header -->
  <header class="max-w-7xl mx-auto mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800 pb-5">
    <div>
      <h1 class="text-xl md:text-2xl font-bold text-slate-50 tracking-tight">Team Task Manager</h1>
      <p class="text-xs md:text-sm text-slate-400 mt-1 break-words">
        Workspace: <span id="current-project-label" class="font-semibold text-slate-200">...</span>
      </p>
    </div>
    <div class="flex flex-wrap items-center gap-2 sm:gap-3 w-full sm:w-auto">
      <span id="connection-status" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-500/10 text-slate-400 border border-slate-500/20">
        <span class="w-2 h-2 rounded-full bg-slate-400"></span>
        Connecting...
      </span>
      <button id="btn-refresh" class="bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition border border-slate-800">
        Refresh
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto space-y-10">

    <!-- Add Task Form -->
    <section class="glass-panel p-6 rounded-3xl">
      <h2 class="section-label mb-4">New task</h2>

      <form id="task-form" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-3">

        <div class="sm:col-span-2 lg:col-span-5">
          <label class="block text-[11px] font-medium text-slate-400 mb-1">Task Name</label>
          <input
            type="text"
            id="task-title"
            placeholder="e.g. Deploy API, Review PR..."
            required
            maxlength="200"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
          >
        </div>

        <div class="lg:col-span-2">
          <label class="block text-[11px] font-medium text-slate-400 mb-1">Assignee</label>
          <select id="task-assignee" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
            <option value="Omar Alhomidi">Omar Alhomidi</option>
          </select>
        </div>

        <div class="lg:col-span-2">
          <label class="block text-[11px] font-medium text-slate-400 mb-1">Priority</label>
          <select id="task-priority" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
          </select>
        </div>

        <div class="sm:col-span-2 lg:col-span-3">
          <div class="flex flex-wrap justify-between items-center gap-2 mb-1">
            <label class="block text-[11px] font-medium text-slate-400">Deadline</label>
            <div class="flex flex-wrap gap-1.5 md:gap-1">
              <button type="button" data-quicktime="2" class="quicktime-btn text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded transition">+2h</button>
              <button type="button" data-quicktime="24" class="quicktime-btn text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded transition">+1d</button>
              <button type="button" data-quicktime="72" class="quicktime-btn text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded transition">+3d</button>
              <button type="button" data-quicktime="168" class="quicktime-btn text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded transition">+1w</button>
            </div>
          </div>
          <input
            type="datetime-local"
            id="task-deadline"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500 transition"
          >
        </div>

        <div class="sm:col-span-2 lg:col-span-12 flex justify-end">
          <button type="submit" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl py-2.5 px-6 text-sm transition active:scale-[0.98] flex items-center justify-center gap-1.5">
            Create Task
          </button>
        </div>
      </form>
    </section>

    <!-- Filters: Search + Priority + Assignee -->
    <div class="space-y-3 -mb-4">
      <div class="flex flex-col md:flex-row gap-3 md:items-center">
        <div class="relative md:w-72">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search-input" type="search" placeholder="Search tasks..."
            class="w-full bg-slate-950 border
