<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fafbfc">
  <meta name="description" content="Team Task Manager — Kanban board and calendar for multi-project task tracking.">
  <title>Team Task Manager</title>

  <script src="https://cdn.tailwindcss.com"></script>
<script>
  const accent = {
    50: '#eef5ff', 100: '#d9e8ff', 200: '#bcd5ff', 300: '#93bbff',
    400: '#6aa0fa', 500: '#4a86ee', 600: '#3b73d9', 700: '#315fb5',
    800: '#2a4d92', 900: '#243f73', 950: '#17264a'
  };

  tailwind.config = {
    theme: {
      extend: {
        colors: {
          indigo: accent,
          purple: accent,
          pink: accent,
          slate: {
            50:  '#0f1115',   // نص أساسي غامق
            100: '#1a1d23',
            200: '#2a2e36',
            300: '#414652',
            400: '#5a5f6b',   // نص ثانوي
            500: '#757a86',
            600: '#9ca0aa',
            700: '#c5c8cf',   // حدود
            800: '#e2e4e8',   // حدود فاتحة
            900: '#f0f1f4',   // خلفيات أزرار
            950: '#fafbfc'    // خلفية body
          }
        }
      }
    }
  };
</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" type="image/png" href="logo.png">
</head>
<body class="bg-slate-950 text-slate-50 min-h-screen p-4 md:p-8 selection:bg-indigo-500 selection:text-white">
  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"
       role="status" aria-live="polite" aria-atomic="false"></div>

  <header class="max-w-7xl mx-auto mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800 pb-5">
    <div class="min-w-0">
      <h1 class="text-xl md:text-2xl font-bold text-slate-50 tracking-tight">Team Task Manager</h1>
      <p class="text-xs md:text-sm text-slate-400 mt-1 break-words">
        Workspace: <span id="current-project-label" class="font-semibold text-slate-50">...</span>
      </p>
    </div>
    <div class="flex flex-wrap items-center gap-2 sm:gap-3 w-full sm:w-auto">
      <span id="connection-status" role="status" aria-live="polite"
            class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-500/10 text-slate-400 border border-slate-500/20">
        <span class="w-2 h-2 rounded-full bg-slate-400"></span>
        Connecting...
      </span>
      <button id="btn-refresh" type="button"
              class="bg-slate-900 hover:bg-slate-800 text-slate-50 px-3.5 py-2 rounded-xl text-xs font-semibold transition border border-slate-800">
        Refresh
      </button>
      <button id="btn-bulk" type="button"
        class="bg-slate-900 hover:bg-slate-800 text-slate-50 px-3.5 py-2 rounded-full text-xs font-semibold transition border border-indigo-500">
        ⚡ Bulk Import
      </button>
    </div>
  </header>

  <main id="main" class="max-w-7xl mx-auto space-y-10">

    <!-- Add Task Form -->
    <section class="glass-panel p-6 rounded-3xl" aria-labelledby="new-task-heading">
      <h2 id="new-task-heading" class="section-label mb-4">New task</h2>

      <form id="task-form" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-3">

        <div class="sm:col-span-2 lg:col-span-5">
          <label for="task-title" class="block text-[11px] font-medium text-slate-400 mb-1">Task Name</label>
          <input
            type="text"
            id="task-title"
            name="title"
            placeholder="e.g. Deploy API, Review PR..."
            required
            maxlength="200"
            autocomplete="off"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-50 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
          >
        </div>

        <div class="lg:col-span-2">
          <label for="task-assignee" class="block text-[11px] font-medium text-slate-400 mb-1">Assignee</label>
          <select id="task-assignee" name="assignee"
                  class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-50 focus:outline-none focus:border-indigo-500 transition">
            <option value="Omar Alhomidi">Omar Alhomidi</option>
          </select>
        </div>

        <div class="lg:col-span-2">
          <label for="task-priority" class="block text-[11px] font-medium text-slate-400 mb-1">Priority</label>
          <select id="task-priority" name="priority"
                  class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-50 focus:outline-none focus:border-indigo-500 transition">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
          </select>
        </div>

        <div class="sm:col-span-2 lg:col-span-3">
          <div class="flex flex-wrap justify-between items-center gap-2 mb-1">
            <label for="task-deadline" class="block text-[11px] font-medium text-slate-400">Deadline</label>
            <div class="flex flex-wrap gap-1.5 md:gap-1" role="group" aria-label="Quick deadline presets">
              <button type="button" data-quicktime="2"   class="quicktime-btn text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-50 px-1.5 py-0.5 rounded transition">+2h</button>
              <button type="button" data-quicktime="24"  class="quicktime-btn text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-50 px-1.5 py-0.5 rounded transition">+1d</button>
              <button type="button" data-quicktime="72"  class="quicktime-btn text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-50 px-1.5 py-0.5 rounded transition">+3d</button>
              <button type="button" data-quicktime="168" class="quicktime-btn text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-50 px-1.5 py-0.5 rounded transition">+1w</button>
            </div>
          </div>
          <input
            type="datetime-local"
            id="task-deadline"
            name="deadline"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-slate-50 focus:outline-none focus:border-indigo-500 transition"
          >
        </div>

        <div class="sm:col-span-2 lg:col-span-12 flex justify-end">
          <button type="submit"
                  class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl py-2.5 px-6 text-sm transition active:scale-[0.98] flex items-center justify-center gap-1.5">
            Create Task
          </button>
        </div>
      </form>
    </section>

    <!-- Search input & Filters -->
    <section aria-label="Filters" class="space-y-3">
      <div class="flex flex-col md:flex-row md:flex-wrap gap-3 md:items-center">

        <div class="relative w-full md:w-72">
          <label for="search-input" class="sr-only">Search tasks</label>
          <svg class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
          </svg>
          <input id="search-input" type="search" placeholder="Search tasks..."
                 autocomplete="off"
                 class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-3 py-2.5 text-sm text-slate-50 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        </div>

        <div id="priority-filter" class="flex flex-wrap items-center gap-2" role="group"></div>
        <div id="assignee-filter" class="flex flex-wrap items-center gap-2" role="group"></div>
      </div>
    </section>

<!-- Kanban Board -->
    <section aria-labelledby="kanban-heading" class="space-y-3">
      <div class="flex items-end justify-between gap-3">
        <h2 id="kanban-heading" class="section-label">Board</h2>
        <p class="hidden sm:block text-[11px] text-slate-500">Drag cards between columns</p>
      </div>

      <!-- Mobile column switcher (شريط أزرار التنقل للجوال فقط) -->
      <div class="grid grid-cols-3 gap-2 md:hidden" role="group" aria-label="Switch kanban column">
        <button type="button" data-tab="todo" class="status-tab active" aria-label="Show To Do tasks">
          <span class="text-[10px] uppercase tracking-wide">To Do</span>
          <span class="tab-count" id="tab-count-todo">0</span>
        </button>
        <button type="button" data-tab="in-progress" class="status-tab" aria-label="Show In Progress tasks">
          <span class="text-[10px] uppercase tracking-wide">Progress</span>
          <span class="tab-count" id="tab-count-in-progress">0</span>
        </button>
        <button type="button" data-tab="done" class="status-tab" aria-label="Show Done tasks">
          <span class="text-[10px] uppercase tracking-wide">Done</span>
          <span class="tab-count" id="tab-count-done">0</span>
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

        <!-- To Do -->
        <div class="kanban-panel glass-panel rounded-2xl p-3 flex flex-col min-h-[180px]" data-drop-status="todo">
          <div class="flex items-center justify-between px-1 pb-2 mb-2 border-b border-slate-800/70">
            <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-400">To Do</h3>
            <span id="count-todo" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-800 text-slate-50">0</span>
          </div>
          <div id="col-todo" class="space-y-3 flex-1"></div>
        </div>

        <!-- In Progress -->
        <div class="kanban-panel glass-panel rounded-2xl p-3 flex flex-col min-h-[180px]" data-drop-status="in-progress">
          <div class="flex items-center justify-between px-1 pb-2 mb-2 border-b border-slate-800/70">
            <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-400">In Progress</h3>
            <span id="count-in-progress" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-800 text-slate-50">0</span>
          </div>
          <div id="col-in-progress" class="space-y-3 flex-1"></div>
        </div>

        <!-- Done -->
        <div class="kanban-panel glass-panel rounded-2xl p-3 flex flex-col min-h-[180px]" data-drop-status="done">
          <div class="flex items-center justify-between px-1 pb-2 mb-2 border-b border-slate-800/70">
            <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Done</h3>
            <span id="count-done" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-800 text-slate-50">0</span>
          </div>
          <div id="col-done" class="space-y-3 flex-1"></div>
        </div>
      </div>
    </section>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

        <!-- To Do -->
        <div class="kanban-panel glass-panel rounded-2xl p-3 flex flex-col min-h-[180px]" data-drop-status="todo">
          <div class="flex items-center justify-between px-1 pb-2 mb-2 border-b border-slate-800/70">
            <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-400">To Do</h3>
            <span id="count-todo" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-800 text-slate-50">0</span>
          </div>
          <div id="col-todo" class="space-y-3 flex-1"></div>
        </div>

        <!-- In Progress -->
        <div class="kanban-panel glass-panel rounded-2xl p-3 flex flex-col min-h-[180px]" data-drop-status="in-progress">
          <div class="flex items-center justify-between px-1 pb-2 mb-2 border-b border-slate-800/70">
            <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-400">In Progress</h3>
            <span id="count-in-progress" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-800 text-slate-50">0</span>
          </div>
          <div id="col-in-progress" class="space-y-3 flex-1"></div>
        </div>

        <!-- Done -->
        <div class="kanban-panel glass-panel rounded-2xl p-3 flex flex-col min-h-[180px]" data-drop-status="done">
          <div class="flex items-center justify-between px-1 pb-2 mb-2 border-b border-slate-800/70">
            <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Done</h3>
            <span id="count-done" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-800 text-slate-50">0</span>
          </div>
          <div id="col-done" class="space-y-3 flex-1"></div>
        </div>
      </div>
    </section>

    <!-- Calendar -->
    <section aria-labelledby="cal-heading" class="space-y-3">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div class="min-w-0">
          <h2 id="cal-heading" class="section-label">Calendar</h2>
          <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1 mt-1">
            <span id="cal-title" class="text-base font-semibold text-slate-50 truncate" aria-live="polite">—</span>
            <span id="cal-range" class="text-xs text-slate-400"></span>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <div class="flex items-center gap-0.5 bg-slate-900 border border-slate-800 rounded-xl p-1">
            <button id="cal-prev" type="button" class="w-8 h-8 inline-flex items-center justify-center rounded-lg text-slate-400 hover:text-slate-50 hover:bg-slate-800 transition">‹</button>
            <button id="cal-today" type="button" class="px-3 h-8 rounded-lg text-xs font-semibold text-slate-50 hover:bg-slate-800 transition">Today</button>
            <button id="cal-next" type="button" class="w-8 h-8 inline-flex items-center justify-center rounded-lg text-slate-400 hover:text-slate-50 hover:bg-slate-800 transition">›</button>
          </div>

          <div class="flex items-center gap-0.5 bg-slate-900 border border-slate-800 rounded-xl p-1" role="group">
            <button type="button" class="cal-view-btn" data-cal-view="day">Day</button>
            <button type="button" class="cal-view-btn" data-cal-view="week">Week</button>
            <button type="button" class="cal-view-btn" data-cal-view="month">Month</button>
          </div>
        </div>
      </div>

      <div id="calendar-container" class="overflow-x-auto"></div>
    </section>
  </main>

  <!-- Edit Task Modal -->
  <div id="edit-modal" class="hidden fixed inset-0 z-50 items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
    <div class="glass-panel w-full max-w-lg rounded-2xl p-5 sm:p-6 space-y-4">
      <div class="flex items-start justify-between gap-3">
        <h2 id="edit-modal-title" class="section-label">Edit task</h2>
        <button type="button" data-close-modal class="text-slate-400 hover:text-slate-50 transition text-sm leading-none p-2 -m-2 rounded-lg">✕</button>
      </div>

      <form id="edit-form" class="space-y-3">
        <input type="hidden" id="edit-id">

        <div>
          <label for="edit-title" class="block text-[11px] font-medium text-slate-400 mb-1">Task name</label>
          <input id="edit-title" type="text" required maxlength="200" autocomplete="off"
                 class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-50 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label for="edit-assignee" class="block text-[11px] font-medium text-slate-400 mb-1">Assignee</label>
            <select id="edit-assignee" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-50 focus:outline-none focus:border-indigo-500 transition"></select>
          </div>
          <div>
            <label for="edit-priority" class="block text-[11px] font-medium text-slate-400 mb-1">Priority</label>
            <select id="edit-priority" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-50 focus:outline-none focus:border-indigo-500 transition">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="critical">Critical</option>
            </select>
          </div>
        </div>

        <div>
          <label for="edit-deadline" class="block text-[11px] font-medium text-slate-400 mb-1">Deadline</label>
          <input id="edit-deadline" type="datetime-local"
                 class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-slate-50 focus:outline-none focus:border-indigo-500 transition">
        </div>

        <div class="flex justify-end gap-2 pt-1">
          <button type="button" data-close-modal class="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-50 bg-slate-900 border border-slate-800 hover:bg-slate-800 transition">
            Cancel
          </button>
          <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 transition active:scale-[0.98]">
            Save changes
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bulk Import Modal -->
  <div id="bulk-import-modal" class="hidden fixed inset-0 z-50 items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
    <div class="glass-panel w-full max-w-2xl rounded-2xl p-5 sm:p-6 space-y-4">
      <div class="flex items-start justify-between gap-3">
        <div>
          <h2 id="bulk-modal-title" class="section-label">⚡ Developer Bulk Import</h2>
          <p class="text-xs text-slate-400 mt-1.5 leading-relaxed">Paste JSON or plain text lines</p>
        </div>
        <button type="button" data-bulk-close class="text-slate-400 hover:text-slate-50 transition text-sm leading-none p-2 -m-2 rounded-lg">✕</button>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-2">
        <span id="bulk-badge" data-state="empty" class="bulk-badge inline-flex items-center px-3 py-1.5 rounded-full text-xs font-semibold border">Waiting for input…</span>
        <div class="flex gap-2">
          <button type="button" id="bulk-sample-json" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-50 bg-slate-900 border border-slate-800 hover:bg-slate-800 transition">📄 Sample JSON</button>
          <button type="button" id="bulk-sample-text" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-50 bg-slate-900 border border-slate-800 hover:bg-slate-800 transition">📝 Plain Text</button>
        </div>
      </div>

      <textarea id="bulk-input" rows="12" spellcheck="false"
                placeholder='[{"title": "My task", "priority": "high"}]  — or —  one task per line'
                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs font-mono text-slate-50 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition resize-y"></textarea>

      <div class="flex justify-end gap-2">
        <button type="button" data-bulk-close class="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-50 bg-slate-900 border border-slate-800 hover:bg-slate-800 transition">
          إلغاء / Cancel
        </button>
        <button type="button" id="bulk-submit" disabled class="px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 transition active:scale-[0.98]">
          إضافة المهام / Import Tasks
        </button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
